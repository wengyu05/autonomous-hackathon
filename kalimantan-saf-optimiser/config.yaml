# SAF supply chain optimiser: every number the code uses lives here.
# Items marked GIVEN come from the organisers' brief. Everything else is an ASSUMPTION
# (ids A1..A13 match CLAUDE.md section 3) and is shown in the dashboard's Assumptions panel.

data:
  biomass_csv: data/kalimantan_80_locations_6800kt_full_range.csv
  airports_glob: "data/airport*.dat"
  geo_json: data/borneo_geo.json     # coastline + offshore checks, from src/geo_extract.py

airports:                            # GIVEN: only these 4, matched on IATA code
  PNK: Supadio Intl
  PKN: Iskandar Intl
  BPN: Sultan Aji Muhammad Sulaiman Sepinggan Intl
  TRK: Juwata Intl

biomass_checks:                      # GIVEN: what the brief says about the biomass file
  n_sites: 80
  total_kt: 6800
  min_kt: 20
  max_kt: 100
  bbox: {lat_min: -4.5, lat_max: 4.5, lon_min: 108.0, lon_max: 119.5}

mode: meet_demand                    # A1: meet_demand | process_all (decided rev 3)

demand_kt:                           # A2: SAF kt/yr per airport. PLACEHOLDER; dashboard input
  PNK: 170
  PKN: 170
  BPN: 170
  TRK: 170

refinery_yield: 0.20                 # A3: t SAF per t biomass into the refinery
depot_yield: 1.0                     # A4: t out per t in at the depot
refinery_capacity_basis: output      # A5: output (SAF) | input (biomass)
depot_capacity_basis: input          # A6
opex_rate: 0.05                      # A7: share of CapEx per year
capex_annualisation:                 # A8: capital recovery factor from these
  years: 20
  rate: 0.08
roads:                               # A9: truck km come from real roads (OpenStreetMap via OSRM)
  source: osrm                       # osrm | haversine (straight line x circuity, for comparison)
  server: https://router.project-osrm.org
  matrix_cache: data/road_matrix.json
  routes_cache: data/road_routes.json
circuity: 1.3                        # A9: off-road stretch (site to nearest road) = straight line x this;
                                     #     also the whole distance when roads.source = haversine
max_per_site:                        # A10
  depot: 4
  refinery: 2
nearest_depots_per_site: null        # A11: null = keep all biomass -> depot arcs
sea_leg:                             # A12: Tarakan is an island; surcharge 0 = flag only
  airports: [TRK]
  surcharge_usd_per_t: 0
offshore_sites: supply_only          # A13: supply_only = keep biomass, build nothing there

candidates:
  kmeans_k: 20                       # extra depot/refinery candidates at weighted centroids
  kmeans_seed: 42
  refinery_at_airports: true

facilities:                          # GIVEN
  depot:
    Small: {capex_usd: 2250000, capacity_kt: 150}
    Large: {capex_usd: 4500000, capacity_kt: 300}
  refinery:
    Small: {capex_usd: 480000000, capacity_kt: 500}
    Large: {capex_usd: 765000000, capacity_kt: 1087}

transport:                           # GIVEN: USD per tonne-km; truck sizes only for trip counts
  biomass_to_depot: {usd_per_tkm: 0.10, truck_t: {Small: 3, Large: 9}}
  depot_to_refinery: {usd_per_tkm: 0.12, truck_t: {Small: 18, Large: 30}}
  refinery_to_airport: {usd_per_tkm: 0.08, truck_t: {Small: 16, Large: 32}}

solver:
  name: HiGHS                        # HiGHS (via highspy) | CBC (bundled with pulp 3.x)
  time_limit_s: 300                  # whole refinery-mix search, command line
  dashboard_time_limit_s: 60
  mip_gap: 0.005
  threads: 4

verify:
  tolerance: 1.0e-6
  cost_tolerance_usd: 1.0
